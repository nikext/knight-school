# E3 primer SFT with the T8 fallback (TRAINING.md §5, ADR-024): m4-sft-primer-m lost the RL answer
# format (probe format 0.00 at its first checkpoints), so this run trains on primer-M plus 26k T8
# examples (2%: T5 positions re-asked with the RL prompt, answered as <answer>SAN</answer>).
# Same image and settings as m4-sft-primer-m; only the data dir and the run name change.
# E3 primer-M SFT (task M4 §3-4): Qwen3.5-2B full fine-tune on primer-M (1.3M examples, 186.5M
# tokens), ADR-023; then the final model on dev500 (the format check), test2000 and E0 (probe500).
# Estimate (ADR-023): 4.6-6 h of training + boot, checkpoint writes and evals, ~$17-21.
# max_hours 9 leaves room for a slower MFU; a cut-off run keeps its last 30-min checkpoint and
# can be finished under a new id, as m3-e2-sparse-v2-r2 was.
# Spot handling as in M3 (ADR-020): us-central1-c first, stockouts waited out for up to 12 h.
id: m4-sft-primer-m-t8
milestone: M4
description: "E3: primer-M + T8 SFT (full fine-tune), then dev500, test2000, probe500"
machine: a2-ultragpu-1g
gpus: 1
zones: [us-central1-c, europe-west4-a, us-central1-a]
max_hours: 9
max_attempts: 6
stockout_wait_hours: 12
run_budget_usd: 35
boot_disk_gb: 200
image: us-central1-docker.pkg.dev/knight-school-nt26/knight-school/train:1a92ddf79865@sha256:d8ebb5f19ae14b1a3ddc10fc7122c0b604166e6797ce1d2721939ef350da18f2
command: "bash configs/jobs/m4-sft.sh"
env:
  KS_PRICE_PER_HOUR: "3.070"  # us-central1 spot A100 + 200 GB boot disk
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TRAIN_CONFIG: "configs/train/sft.yaml"
  TRAIN_SETS: "name=m4-sft-primer-m-t8 data=gs://knight-school-nt26-knight-school/data/v1/primer/M-t8"
  TEST_SET: "test2000"
