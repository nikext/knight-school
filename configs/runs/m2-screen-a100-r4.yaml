# M2 screening on one spot A100 80GB (task M2 §5, §6, §8): dev500 zero-shot for every
# candidate and thinking mode, a 5-step GRPO + LoRA + vLLM-colocate smoke per base model, and
# E0 (probe500) per base model. Planned for an L4 (~1.5 h, ~$0.70); the user chose the A100 for
# about half the wall time (~45 min, ~$2.50), 2026-10-21.
# r2: r1 failed in 9 min ($0.46) on two image bugs: configs resolved under site-packages
# (non-editable install) and a CUDA-13 torchcodec in the cu129 base broke the TRL import.
# Both fixed in train:dc0414663210, whose build now runs a CPU smoke and the imports.
# r3: r2 was preempted after 23 min ($1.19) and lost its results (outputs were only synced at
# the end); the ledger calls it "vanished" because the shutdown marker never landed. r3 is that
# preemption retry under a new id, on an image whose job pushes /out after every step and whose
# retries resume (and `ks watch` now reads preemptions from the audit log).
# r4: r3 got no VM (A100 spot stockout in us-central1-a and -c, $0); same image and job.
# Results: gs://BUCKET/runs/m2-screen-a100-r4/attempts/<n>/out/
id: m2-screen-a100-r4
milestone: M2
description: "dev500 screening, GRPO compatibility smoke, E0 probes for the candidate models"
machine: a2-ultragpu-1g
gpus: 1
zones: [us-central1-a, us-central1-c]
max_hours: 1.5
max_attempts: 2
boot_disk_gb: 200
image: us-central1-docker.pkg.dev/knight-school-nt26/knight-school/train:90bfc56fc862@sha256:5750820ecc59b72928dc82f11db31cef6e5b5e404c69d12ac7b345e7437b7e7c
command: "bash configs/jobs/m2-screen.sh"
env:
  KS_PRICE_PER_HOUR: "3.040"
  VLLM_USE_FLASHINFER_SAMPLER: "0"  # its sampler JITs with nvcc; the torch sampler is fine here
  SCREEN_MODELS: "qwen3.5-2b qwen3-1.7b gemma4-e2b qwen3.5-2b-native qwen3-1.7b-native"
  SMOKE_MODELS: "qwen3.5-2b qwen3-1.7b gemma4-e2b"
  PROBE_MODELS: "qwen3.5-2b qwen3-1.7b gemma4-e2b"
  RL_TRAIN: "gs://knight-school-nt26-knight-school/data/v1/positions/rl_train.parquet"
