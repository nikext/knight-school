# E5d (task M5, ADR-007 check): base Qwen3.5-2B -> GRPO dense under config v4 (= v3 for the base
# start, ADR-027) with LoRA rank 64 instead of 32 (lora_alpha stays 64, as LoRA Without Regret keeps
# alpha fixed across ranks), 100 steps, dev500 only (every 10 steps, in training). Compared with
# the first 100 steps of m4-e2-dense-v3 (rank 32, same seed, data order and schedule).
# Spot handling as in M3 (ADR-020): us-central1-c first, stockouts waited out for up to 12 h.
id: m5-e5d-r64
milestone: M5
description: "E5d: base -> GRPO dense, LoRA r=64, 100 steps, dev500 only"
machine: a2-ultragpu-1g
gpus: 1
zones: [us-central1-c, europe-west4-a, us-central1-a]
max_hours: 2.5
max_attempts: 6
stockout_wait_hours: 12
run_budget_usd: 12
boot_disk_gb: 200
image: us-central1-docker.pkg.dev/knight-school-nt26/knight-school/train:7190e0411a2e@sha256:ab42254beb7e24340357ec8e32703bd341f35cb0c93df53638ab22f2fd2b636c
command: "bash configs/jobs/m3-grpo.sh"
env:
  KS_PRICE_PER_HOUR: "3.070"  # us-central1 spot A100 + 200 GB boot disk
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TRAIN_CONFIG: "configs/train/grpo_dense.yaml"
  TRAIN_SETS: "name=m5-e5d-r64 lora_r=64 steps=100"
  TEST_SET: "none"
