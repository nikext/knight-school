# E5a rules-only primer SFT (task M5, ADR-026 §1, ADR-028): Qwen3.5-2B full fine-tune on primer
# rules-M (T1-T4 only: board reading, legal moves, move effect, attacks and checks; 1,455,000
# examples, as many tokens as primer-M, no move-choice answers). Same image, trainer, config and
# seed as m4-sft-primer-m-t8; only the data and the run name change. The SFT and eval code is
# unchanged since image 1a92ddf79865. Then dev500 (format check), test2000 (rules-only on its own,
# ADR-026 §2), probe500 (E0), and pass@8 on dev500 (the job also re-runs the base model's pass@8).
# Estimate: m4-sft-primer-m-t8 took 7.03 h and $22.01 for ~191M tokens. max_hours 9 as there.
# Stop rule (RESULTS.md, E5a predictions): probe format < 50% at two checkpoints in a row ->
# stop the VM and ask the user.
# Spot handling as in M3 (ADR-020): us-central1-c first, stockouts waited out for up to 12 h.
id: m5-sft-rules-m
milestone: M5
description: "E5a: rules-only primer SFT (T1-T4, full fine-tune), then dev500, test2000, probe500"
machine: a2-ultragpu-1g
gpus: 1
zones: [us-central1-c, europe-west4-a, us-central1-a]
max_hours: 9
max_attempts: 6
stockout_wait_hours: 12
run_budget_usd: 35
boot_disk_gb: 200
image: us-central1-docker.pkg.dev/knight-school-nt26/knight-school/train:1a92ddf79865@sha256:d8ebb5f19ae14b1a3ddc10fc7122c0b604166e6797ce1d2721939ef350da18f2
command: "bash configs/jobs/m4-sft.sh"
env:
  KS_PRICE_PER_HOUR: "3.070"  # us-central1 spot A100 + 200 GB boot disk
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TRAIN_CONFIG: "configs/train/sft.yaml"
  TRAIN_SETS: "name=m5-sft-rules-m data=gs://knight-school-nt26-knight-school/data/v1/primer/rules-M"
  TEST_SET: "test2000"
