# M3 GRPO smoke (task M3 §4) on one spot A100 80GB, because L4 spot was stocked out in all six
# allowed zones (m3-smoke-l4, -r2, -r3: no VM, $0); the user chose the A100, 2026-10-22. It also
# serves as the A100 throughput measurement (task M3 §5).
# The main model (Qwen3.5-2B), the frozen dense config at full size (64 prompts x 8 completions,
# max 1024 tokens), 20 steps. Checks: no OOM, the reward components move, format is learnable,
# completion lengths (to set max_completion), step time and $/step. Dev500 every 10 steps; after
# training a 50-puzzle dev500 eval of the merged model tests `ks eval --ckpt` (no test-set eval of
# a smoke checkpoint).
# Preemption test (Done-when): after checkpoint 10 is copied, a simulated maintenance event
# preempts the VM; `ks watch` relaunches attempt 2, which must resume from checkpoint 10.
id: m3-smoke-a100
milestone: M3
description: "GRPO smoke + A100 throughput: Qwen3.5-2B, dense, 20 steps, full batch; preemption + resume test"
machine: a2-ultragpu-1g
gpus: 1
zones: [us-central1-a, us-central1-c, europe-west4-a, europe-west4-b]
max_hours: 1.0
max_attempts: 2
run_budget_usd: 5.0
boot_disk_gb: 200
image: us-central1-docker.pkg.dev/knight-school-nt26/knight-school/train:9e386d2f86c1@sha256:231a20d0a33171e73eb31246a962a250d6ff2a1bef7d79d845d2854f30e48b92
command: "bash configs/jobs/m3-grpo.sh"
env:
  KS_PRICE_PER_HOUR: "3.070"  # us-central1 spot A100 + 200 GB boot disk
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TRAIN_CONFIG: "configs/train/grpo_dense.yaml"
  TRAIN_SETS: "name=m3-smoke-a100 steps=20 eval_every=10 save_every=10"
  TEST_SET: "dev500"
  TEST_LIMIT: "50"
