# GRPO hyperparameters for every arm (TRAINING.md §4). Starting values adapted from Chess-R1;
# tuned only in the M3 smoke and throughput tests, then frozen (ADR-019). Revised once (v2,
# ADR-021): v1 collapsed by step 25 in m3-e2-dense (token entropy 0.88 -> 0.06, ~75% of groups
# with zero reward spread from step 40), so v2 adds adaptive entropy control; nothing else that
# shapes learning changed. Revised again (v3, ADR-022): under v2 nothing stopped generation after
# </answer>, and post-answer rambling to the cap took over m3-e2-sparse-v2 from step 150, so v3
# stops every rollout at the first </answer>. v4 (ADR-027, M5): the entropy target comes from
# the start, min(0.2, mean entropy of steps 1-5), because the base-tuned 0.2 pushed a sharp primer
# start away from itself (ADR-025); for a start above 0.2 (every E2 arm) v4 runs as v3. Arms set
# `base: grpo.yaml` and may change only the factor under test (ks.train.config.ARM_KEYS; enforced
# by a test).
name: grpo
model: qwen3.5-2b
task_reward: dense
legal_list: true
data: gs://knight-school-nt26-knight-school/data/v1/positions/rl_train.parquet

lora_r: 32               # ADR-007; on the language model's linear layers only (ADR-018)
lora_alpha: 64
lora_dropout: 0.0
learning_rate: 1.0e-5    # ~10x Chess-R1's full-FT 1e-6 (LoRA Without Regret)
warmup_steps: 10
lr_scheduler: constant_with_warmup
weight_decay: 0.0
max_grad_norm: 1.0

prompts_per_step: 64
generations: 8           # Chess-R1
micro_batch: 32          # completions per forward/backward; efficiency only (length-sorted, dapo: ADR-019)
max_completion: 1024     # revisit from the smoke's p95 (TRAINING.md §4)
temperature: 1.0
beta: 1.0e-3             # Chess-R1
loss_type: dapo          # TRL 1.16 default
mask_truncated: false    # a truncated answer is a wrong answer
stop_at_answer: true     # v3 (ADR-022): stop at the first </answer>; the tokens after it never train
entropy_adaptive: true   # v2 (ADR-021): Skywork-OR1 adaptive entropy bonus, as in TRL 1.16
entropy_target: 0.2      # v1 was still healthy here (steps 15-17: short answers, ~9% dead groups)
entropy_coef_delta: 0.02 # v1 fell from 0.2 to 0.06 in 6 steps; TRL's 0.005 would reach only 0.03
entropy_start_steps: 5   # v4 (ADR-027): no bonus in steps 1-5, then target = min(0.2, their mean)
steps: 200

eval_set: dev500
eval_every: 10           # v2: finer dev curve (~12 s each, ~$0.2/run); was 25
eval_at_start: true
save_every: 10           # v2: lose <= ~6 min to a preemption (~10 s per save); was 25
keep_last: 2

vllm_mem: 0.45
vllm_sleep: false
gradient_checkpointing: true
seed: 2026
samples_per_step: 16
