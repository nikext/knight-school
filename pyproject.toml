[project]
name = "knight-school"
version = "0.1.0"
description = "GRPO on Lichess puzzles for a small open LLM, with a teacher-free chess primer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Nikola T" }]
dependencies = [
    "chess>=1.11.2",
    "google-cloud-storage>=3.17.1",
    "numpy>=2.3",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.27.3",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
# Pinned together (ADR-004, ADR-016): TRL 1.16.0 supports vLLM <= 0.31.0, which pins
# torch 2.13.0 and transformers < 5.18. The container takes vLLM and torch from its base image.
train = [
    "vllm==0.31.0",
    "torch==2.13.0",
    "transformers==5.17.0",
    "trl==1.16.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "tensorboardX==2.6.5",
    "flash-linear-attention==0.5.2",  # Qwen3.5 Gated DeltaNet kernels for training (M3)
    "fla-core==0.5.2",
]
gemini = [
    "google-genai>=2.32.0",
]
plots = [
    "matplotlib>=3.10",
]

[project.scripts]
ks = "ks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long f-strings stay readable

[tool.pyright]
# main.py needs functions-framework, which only exists in the deployed function
include = ["ks", "tests", "infra/killswitch/killswitch_decision.py"]
pythonVersion = "3.12"
extraPaths = ["infra/killswitch"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infra/killswitch"]
addopts = "-q"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
