[project]
name = "knight-school"
version = "0.1.0"
description = "GRPO on Lichess puzzles for a small open LLM, with a teacher-free chess primer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Nikola T" }]
dependencies = [
    "chess>=1.11.2",
    "google-cloud-storage>=3.17.1",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.27.3",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
# torch, vllm, trl, peft: pinned together in M2/M3, installed in the container only.
train = []
gemini = [
    "google-genai>=2.32.0",
]

[project.scripts]
ks = "ks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long f-strings stay readable

[tool.pyright]
# main.py needs functions-framework, which only exists in the deployed function
include = ["ks", "tests", "infra/killswitch/killswitch_decision.py"]
pythonVersion = "3.12"
extraPaths = ["infra/killswitch"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infra/killswitch"]
addopts = "-q"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
