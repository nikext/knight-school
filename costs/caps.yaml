# Money caps. Machine-readable form of docs/BUDGET.md §1. ks.cloud reads it.
# Only the user changes ceilings and allocations (CLAUDE.md, money rules).
# Credit facts are what the user read in Billing -> Credits (there is no API).
currency: USD

pools:
  compute:
    credit: "Google Developer Program premium benefit (CREDIT_TYPE_ANNUAL)"
    scope: "all of Google Cloud Platform and Google Maps APIs (list pricing)"
    remaining_usd: 423.38          # shared with the user's other projects
    checked_on: 2026-10-24T20:30:00Z
    expires: 2026-11-12            # gate: jobs must end 48 h before (ADR-013)
    ceiling: 360                   # min(360, 0.9 x 440.94 = 396.85)
  vertex:
    credit: "Marketing - GDP Premium Support 4"
    # 2026-10-21 -> 24 this credit fell $123.53 with $0 vertex spend, while our GPU spend was
    # $121.00 and the compute credit fell only $17.56: it is being drawn for Compute Engine first.
    scope: "'certain usage'; covers Compute Engine (observed 2026-10-24); Gemini assumed"
    remaining_usd: 85.73
    checked_on: 2026-10-24T20:30:00Z
    expires: 2027-04-08
    usable_from: 2026-11-13        # Gemini waits until the compute credit is gone (ADR-013)
    covers_custom_training: false  # assumed; the vertex M5 line is dead
    ceiling: 180                   # min(180, 0.9 x 209.26 = 188.33)

# Per-milestone allocations. They must sum to each pool's ceiling.
allocations:
  compute: {M0: 5, M1: 1, M2: 15, M3: 70, M4: 100, M5: 110, M6: 9, contingency: 50}
  vertex:  {M0: 1, M1: 0, M2: 50, M3: 0,  M4: 0,   M5: 110, M6: 4, contingency: 15}

limits:
  max_hours_per_job: 24
  max_gpus_per_job: 1
  spot_only: true
  worst_case_factor: 1.05
  prices_max_age_days: 30
  credit_reserve_factor: 0.9       # plan at most 90% of what the credit has left
  credit_check_max_age_days: 7     # the credits are shared: re-read them weekly
  expiry_margin_hours: 48
