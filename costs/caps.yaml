# Money caps. Machine-readable form of docs/BUDGET.md §1. ks.cloud reads it.
# Only the user changes ceilings and allocations (CLAUDE.md, money rules).
currency: USD

pools:
  compute:
    credit: 400        # stated by the user 2026-10-21
    ceiling: 360       # never planned past; M0 sets min(360, 0.9 x remaining)
  vertex:
    credit: 200
    ceiling: 180

# Per-milestone allocations. They must sum to each pool's ceiling.
allocations:
  compute: {M0: 5, M1: 1, M2: 15, M3: 70, M4: 100, M5: 110, M6: 9, contingency: 50}
  vertex:  {M0: 1, M1: 0, M2: 50, M3: 0,  M4: 0,   M5: 110, M6: 4, contingency: 15}

limits:
  max_hours_per_job: 24
  max_gpus_per_job: 1
  spot_only: true
  worst_case_factor: 1.05
  prices_max_age_days: 30

# Filled in M0 from Billing -> Credits (the user reads it; there is no API).
verified:
  checked_on: null
  compute_credit_remaining: null
  compute_credit_expiry: null
  compute_credit_scope: null
  vertex_credit_remaining: null
  vertex_credit_expiry: null
  vertex_credit_scope: null
  vertex_covers_custom_training: null   # false -> vertex M5 line is dead
