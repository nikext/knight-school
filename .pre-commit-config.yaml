repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-secret-files
        name: block .env, key files and credential JSON
        language: fail
        entry: "never commit secrets (CLAUDE.md): "
        files: '(^|/)\.env(\..+)?$|-key\.json$|credentials.*\.json$|application_default_credentials\.json$'
        exclude: '(^|/)\.env\.example$'
      - id: no-service-account-json
        name: block service-account key contents
        language: pygrep
        entry: '"type":\s*"service_account"|"private_key_id"'
        types: [json]
